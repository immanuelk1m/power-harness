name: Provenance audit

on:
  pull_request:
    paths:
      - scripts/audit_run_provenance.py
      - scripts/audit_oof_transfer.py
      - tests/test_audit_run_provenance.py
      - tests/test_audit_oof_transfer.py
      - .github/workflows/provenance-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install pandas pyarrow
      - run: python -m unittest discover -s tests -p 'test_audit_*.py' -v
